<!DOCTYPE html>
<html lang="en" class="page-auth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RBU Sports Booking</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpg">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.jpg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-auth">
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <a href="/" class="header-brand-link">
          <img src="/images/rbu-horizontal-logo.png" alt="Ramdeobaba University" class="header-logo-banner">
          <div class="header-title-group">
            <span class="header-sports-title">Sports</span>
            <span class="header-subtitle">Facility Booking</span>
          </div>
        </a>
      </div>
      <nav class="header-nav" id="headerNav">
        <!-- Filled by JS after login -->
      </nav>
    </div>
  </header>

  <!-- Main content — replaced by JS for each page -->
  <main class="main-content" id="mainContent">
    <div class="auth-page">
      <div class="auth-form-container">
        <h1 class="page-title">Log in</h1>
        <p class="page-description">Use your college ID to access the booking system.</p>

        <div id="loginAlert" class="alert" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="collegeId">College Email or ID</label>
            <input type="text" id="collegeId" name="identifier"
                   placeholder="e.g. yourname@rbunagpur.in or RBU2024001" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <input type="password" id="password" name="password"
                     placeholder="Your password" autocomplete="current-password" required>
              <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Show password">Show</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="loginBtn">Log in</button>
        </form>

        <p class="auth-link">
          No account? <a href="/register.html">Register here</a>
        </p>
      </div>
    </div>
  </main>

  <script src="/js/auth.js"></script>
</body>
</html>
